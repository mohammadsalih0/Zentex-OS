name: Zentex OS CI

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
    - '**.md'
    - '.gitignore'
    - 'LICENSE'

  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Fast Kernel Cross-Compile & QEMU Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mohammadsalih0/zentex-env:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Zentex OS Kernel
      run: make

    - name: Run QEMU Headless Test
      run: |
        timeout 5s qemu-system-riscv64 \
        -machine virt \
        -cpu rv64 \
        -smp 1 \
        -m 128M \
        -bios default \
        -kernel zentex.elf \
        -nographic || exit_code=$?

        # Timeout return code is 124, which is expected for a non-terminating kernel loop
        if [ $exit_code -eq 124 ] || [ $exit_code -eq 0 ] ; then
        echo "QEMU booted successfuly"
        exit 0
        else
        echo "QEMU execution failed with code $exit_code"
        exit 1
        fi